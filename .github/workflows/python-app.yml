# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      redshift-emulator:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: Admin123!
          POSTGRES_DB: dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5439:5432

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Initialize Redshift emulator schema
      env:
        PGHOST: localhost
        PGPORT: 5439
        PGUSER: admin
        PGPASSWORD: Admin123!
        PGDATABASE: dev
      run: |
        apt-get update && apt-get install -y postgresql-client
        psql -h localhost -p 5439 -U admin -d dev -f tests/fixtures/init_schema.sql
        psql -h localhost -p 5439 -U admin -d dev -f tests/fixtures/seed_data.sql
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        REDSHIFT_HOST: localhost
        REDSHIFT_PORT: 5439
        REDSHIFT_DB: dev
        REDSHIFT_USER: admin
        REDSHIFT_PASSWORD: Admin123!
      run: |
        pytest --cov-report=xml
    - name: Check coverage threshold
      run: |
        python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = float(root.get('lines-valid'))
        lines_covered = float(root.get('lines-covered'))
        if coverage > 0:
            percentage = (lines_covered / coverage) * 100
            print(f'Coverage: {percentage:.2f}%')
            if percentage < 40:
                print('Warning: Coverage is below 40% threshold for Phase 1')
        "
